stages:
  - build
  - deploy

variables:
  DEPLOY_HOST: "192.0.2.12"
  GIT_SSL_NO_VERIFY: "true"
  # Секреты берутся из GitLab CI/CD Variables:
  # DATABASE_URL, JWT_SECRET, SMTP_PASSWORD, DATANEWTON_API_KEY
  # THESIS_DB_URL, PARTNER_SYNC_INTERVAL_MINUTES, PARTNER_CREATE_RESTRICTED
  # STAGE_DATABASE_URL, STAGE_JWT_SECRET (для стейджа)

# =====================================================
# PRODUCTION (branch release/v1, port 3001)
# =====================================================

prod:build:api:
  stage: build
  image: docker:25.0.5-git
  timeout: 20m
  tags:
    - docker
    - nextjs
  script:
    - docker compose -p pmdb-prod -f docker-compose.yml build api
  only:
    - release/v1

prod:build:web-assets:
  stage: build
  image: node:20-alpine
  timeout: 20m
  tags:
    - docker
    - nextjs
  script:
    - npm ci
    - export VITE_PARTNER_CREATE_RESTRICTED="${PARTNER_CREATE_RESTRICTED:-true}"
    - cd apps/web && npx vite build
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 hour
  only:
    - release/v1

prod:build:web:
  stage: build
  image: docker:25.0.5-git
  tags:
    - docker
    - nextjs
  needs:
    - prod:build:web-assets
  script:
    - docker compose -p pmdb-prod -f docker-compose.yml build web
  only:
    - release/v1

prod:deploy:
  stage: deploy
  image: docker:25.0.5-git
  tags:
    - docker
    - nextjs
  needs:
    - prod:build:api
    - prod:build:web
  script:
    - |
      set -e
      export WEB_PORT=3001
      export DATABASE_URL="${DATABASE_URL}"
      export JWT_SECRET="${JWT_SECRET}"
      export FRONTEND_URL="${FRONTEND_URL}"
      export FILE_UPLOAD_URL="${FILE_UPLOAD_URL}"
      export SMTP_HOST="${SMTP_HOST}"
      export SMTP_PORT="${SMTP_PORT}"
      export SMTP_SECURE="${SMTP_SECURE}"
      export SMTP_USER="${SMTP_USER}"
      export SMTP_PASSWORD="${SMTP_PASSWORD}"
      export SMTP_FROM="${SMTP_FROM}"
      export DATANEWTON_API_KEY="${DATANEWTON_API_KEY}"
      export EXTERNAL_HR_USERS_URL="${EXTERNAL_HR_USERS_URL:-}"
      export EXTERNAL_HR_API_TOKEN="${EXTERNAL_HR_API_TOKEN:-}"
      export EXTERNAL_HR_ASSET_BASE_URL="${EXTERNAL_HR_ASSET_BASE_URL:-}"
      export HR_USERS_SYNC_SECRET="${HR_USERS_SYNC_SECRET:-}"
      export HR_SYNC_INTERVAL_MINUTES="${HR_SYNC_INTERVAL_MINUTES:-15}"
      export THESIS_DB_URL="${THESIS_DB_URL:-}"
      export PARTNER_SYNC_INTERVAL_MINUTES="${PARTNER_SYNC_INTERVAL_MINUTES:-15}"
      export PARTNER_CREATE_RESTRICTED="${PARTNER_CREATE_RESTRICTED:-true}"
      # Если пусто — compose подставит пустую строку в контейнер → 503 на /partners/inn-lookup
      if [ -z "${DATANEWTON_API_KEY:-}" ]; then
        echo "ERROR: DATANEWTON_API_KEY пустая или не видна этой джобе."
        echo "Проверь GitLab → CI/CD → Variables (имя, Environment, после снятия Protected — заново запусти deploy)."
        exit 1
      fi
      docker compose -p pmdb-prod -f docker-compose.yml down || true
      docker compose -p pmdb-prod -f docker-compose.yml up -d
      docker image prune -f || true
  environment:
    name: production
    url: http://$DEPLOY_HOST:3001
  only:
    - release/v1

# =====================================================
# STAGE (branch stage, port 3002)
# =====================================================

stage:build:api:
  stage: build
  image: docker:25.0.5-git
  timeout: 20m
  tags:
    - docker
    - nextjs
  script:
    - docker compose -p pmdb-stage -f docker-compose.stage.yml build api
  only:
    - stage

stage:build:web-assets:
  stage: build
  image: node:20-alpine
  timeout: 20m
  tags:
    - docker
    - nextjs
  script:
    - npm ci
    - export VITE_PARTNER_CREATE_RESTRICTED="${STAGE_PARTNER_CREATE_RESTRICTED:-true}"
    - cd apps/web && npx vite build
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 hour
  only:
    - stage

stage:build:web:
  stage: build
  image: docker:25.0.5-git
  tags:
    - docker
    - nextjs
  needs:
    - stage:build:web-assets
  script:
    - docker compose -p pmdb-stage -f docker-compose.stage.yml build web
  only:
    - stage

stage:deploy:
  stage: deploy
  image: docker:25.0.5-git
  tags:
    - docker
    - nextjs
  needs:
    - stage:build:api
    - stage:build:web
  script:
    - |
      set -e
      export WEB_PORT=3002
      export DATABASE_URL="${STAGE_DATABASE_URL}"
      export JWT_SECRET="${STAGE_JWT_SECRET:-${JWT_SECRET}}"
      export FRONTEND_URL="http://192.0.2.12:3002,http://localhost:3002"
      export FILE_UPLOAD_URL="http://192.0.2.12:3002/api"
      # Стейдж шлёт письма в MailHog (192.0.2.12:1025), боевой SMTP — только прод.
      # При необходимости переопределяется через STAGE_SMTP_* в CI/CD Variables.
      export SMTP_HOST="${STAGE_SMTP_HOST:-192.0.2.12}"
      export SMTP_PORT="${STAGE_SMTP_PORT:-1025}"
      export SMTP_SECURE="${STAGE_SMTP_SECURE:-false}"
      export SMTP_USER="${STAGE_SMTP_USER:-}"
      export SMTP_PASSWORD="${STAGE_SMTP_PASSWORD:-}"
      export SMTP_FROM="${STAGE_SMTP_FROM:-pmdb-stage@test.local}"
      export DATANEWTON_API_KEY="${DATANEWTON_API_KEY}"
      export EXTERNAL_HR_USERS_URL="${EXTERNAL_HR_USERS_URL:-}"
      export EXTERNAL_HR_API_TOKEN="${EXTERNAL_HR_API_TOKEN:-}"
      export EXTERNAL_HR_ASSET_BASE_URL="${EXTERNAL_HR_ASSET_BASE_URL:-}"
      export HR_USERS_SYNC_SECRET="${HR_USERS_SYNC_SECRET:-}"
      export HR_SYNC_INTERVAL_MINUTES=0
      export PARTNER_ENABLE_OPERATIONAL_STATUS_DERIVE=true
      export THESIS_DB_URL="${STAGE_THESIS_DB_URL:-${THESIS_DB_URL:-}}"
      export PARTNER_SYNC_INTERVAL_MINUTES="${STAGE_PARTNER_SYNC_INTERVAL_MINUTES:-15}"
      export PARTNER_CREATE_RESTRICTED="${STAGE_PARTNER_CREATE_RESTRICTED:-true}"
      docker compose -p pmdb-stage -f docker-compose.stage.yml down || true
      docker compose -p pmdb-stage -f docker-compose.stage.yml up -d
      docker image prune -f || true
  environment:
    name: staging
    url: http://$DEPLOY_HOST:3002
  only:
    - stage
