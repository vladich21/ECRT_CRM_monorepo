stages:
  - build
  - deploy

variables:
  DEPLOY_HOST: "192.0.2.12"
  # Стенды переехали на jarvis; прод остаётся на .207.
  STAGE_DEPLOY_HOST: "192.0.2.19"
  GIT_SSL_NO_VERIFY: "true"
  # Секреты берутся из GitLab CI/CD Variables:
  # DATABASE_URL, JWT_SECRET, SMTP_PASSWORD, DATANEWTON_API_KEY
  # THESIS_DB_URL, PARTNER_SYNC_INTERVAL_MINUTES, PARTNER_CREATE_RESTRICTED
  # ONLYOFFICE_URL, ONLYOFFICE_JWT_SECRET (OnlyOffice Document Server)
  # STAGE_DATABASE_URL, STAGE_JWT_SECRET (для стейджа)
  # STAGE_ONLYOFFICE_URL, STAGE_ONLYOFFICE_JWT_SECRET (для стейджа)
  # FILES_SERVICE_URL, FILES_API_KEY (прод: files-service на 207)
  # STAGE_FILES_SERVICE_URL, STAGE_FILES_API_KEY (стейдж: files-service на 74)
  # STAGE_AUTH_RATE_LIMIT_MAX / WINDOW_MS (стейдж мягче, прод — дефолт 5/15мин)

# =====================================================
# PRODUCTION (branch release/v1, port 3001)
# =====================================================

prod:build:api:
  stage: build
  image: docker:25.0.5-git
  timeout: 20m
  tags:
    - docker
    - nextjs
  script:
    - docker compose -p pmdb-prod -f docker-compose.yml build api
  only:
    - release/v1

prod:build:web-assets:
  stage: build
  image: node:20-alpine
  timeout: 40m
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    # Иначе runner режет step_script на 10m, даже если timeout джобы 20m+.
    RUNNER_SCRIPT_TIMEOUT: 35m
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  tags:
    - docker
    - nextjs
  script:
    # ignore-scripts: не собираем argon2 бэкенда — для vite он не нужен и на alpine часто съедает весь лимит.
    - npm ci --ignore-scripts --no-audit --no-fund --progress=false
    - export VITE_API_URL=/api
    - export VITE_FILE_URL=/api
    - export VITE_PARTNER_CREATE_RESTRICTED="${PARTNER_CREATE_RESTRICTED:-true}"
    - cd apps/web && npx vite build
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 hour
  only:
    - release/v1

prod:build:web:
  stage: build
  image: docker:25.0.5-git
  tags:
    - docker
    - nextjs
  needs:
    - prod:build:web-assets
  script:
    - docker compose -p pmdb-prod -f docker-compose.yml build web
  only:
    - release/v1

prod:deploy:
  stage: deploy
  image: docker:25.0.5-git
  tags:
    - docker
    - nextjs
  needs:
    - prod:build:api
    - prod:build:web
  script:
    - |
      set -e
      export WEB_PORT=3001
      export DATABASE_URL="${DATABASE_URL}"
      export JWT_SECRET="${JWT_SECRET}"
      export FRONTEND_URL="${FRONTEND_URL}"
      export FILE_UPLOAD_URL="${FILE_UPLOAD_URL}"
      export SMTP_HOST="${SMTP_HOST}"
      export SMTP_PORT="${SMTP_PORT}"
      export SMTP_SECURE="${SMTP_SECURE}"
      export SMTP_USER="${SMTP_USER}"
      export SMTP_PASSWORD="${SMTP_PASSWORD}"
      export SMTP_FROM="${SMTP_FROM}"
      export DATANEWTON_API_KEY="${DATANEWTON_API_KEY}"
      export EXTERNAL_HR_USERS_URL="${EXTERNAL_HR_USERS_URL:-}"
      export EXTERNAL_HR_API_TOKEN="${EXTERNAL_HR_API_TOKEN:-}"
      export EXTERNAL_HR_ASSET_BASE_URL="${EXTERNAL_HR_ASSET_BASE_URL:-}"
      export HR_USERS_SYNC_SECRET="${HR_USERS_SYNC_SECRET:-}"
      export HR_SYNC_INTERVAL_MINUTES="${HR_SYNC_INTERVAL_MINUTES:-15}"
      export THESIS_DB_URL="${THESIS_DB_URL:-}"
      export PARTNER_SYNC_INTERVAL_MINUTES="${PARTNER_SYNC_INTERVAL_MINUTES:-15}"
      export PARTNER_CREATE_RESTRICTED="${PARTNER_CREATE_RESTRICTED:-true}"
      # OnlyOffice Document Server (секрет — в CI/CD Variables)
      export ONLYOFFICE_URL="${ONLYOFFICE_URL:-}"
      export ONLYOFFICE_JWT_SECRET="${ONLYOFFICE_JWT_SECRET:-}"
      export FILES_SERVICE_URL="${FILES_SERVICE_URL:-}"
      export FILES_API_KEY="${FILES_API_KEY:-}"
      # Если пусто — compose подставит пустую строку в контейнер → 503 на /partners/inn-lookup
      if [ -z "${DATANEWTON_API_KEY:-}" ]; then
        echo "ERROR: DATANEWTON_API_KEY пустая или не видна этой джобе."
        echo "Проверь GitLab → CI/CD → Variables (имя, Environment, после снятия Protected — заново запусти deploy)."
        exit 1
      fi
      docker compose -p pmdb-prod -f docker-compose.yml down || true
      docker compose -p pmdb-prod -f docker-compose.yml up -d
      docker image prune -f || true
  environment:
    name: production
    url: http://$DEPLOY_HOST:3001
  only:
    - release/v1

# =====================================================
# STAGE (branch stage, port 3002)
# =====================================================

stage:build:api:
  stage: build
  image: docker:25.0.5-git
  timeout: 20m
  tags:
    - stands_jarvis
  script:
    - docker compose -p pmdb-stage -f docker-compose.stage.yml build api
  only:
    - stage

stage:build:web-assets:
  stage: build
  image: node:20-alpine
  timeout: 40m
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
    RUNNER_SCRIPT_TIMEOUT: 35m
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  tags:
    - stands_jarvis
  script:
    - npm ci --ignore-scripts --no-audit --no-fund --progress=false
    - export VITE_API_URL=/api
    - export VITE_FILE_URL=/api
    - export VITE_PARTNER_CREATE_RESTRICTED="${STAGE_PARTNER_CREATE_RESTRICTED:-true}"
    - cd apps/web && npx vite build
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 hour
  only:
    - stage

stage:build:web:
  stage: build
  image: docker:25.0.5-git
  tags:
    - stands_jarvis
  needs:
    - stage:build:web-assets
  script:
    - docker compose -p pmdb-stage -f docker-compose.stage.yml build web
  only:
    - stage

stage:deploy:
  stage: deploy
  image: docker:25.0.5-git
  tags:
    - stands_jarvis
  needs:
    - stage:build:api
    - stage:build:web
  script:
    - |
      set -e
      export WEB_PORT=3002
      export DATABASE_URL="${STAGE_DATABASE_URL}"
      export JWT_SECRET="${STAGE_JWT_SECRET:-${JWT_SECRET}}"
      export FRONTEND_URL="http://192.0.2.19:3002,http://localhost:3002"
      export FILE_UPLOAD_URL="http://192.0.2.19:3002/api"
      # OnlyOffice Document Server стейджа (секрет — в CI/CD Variables)
      export ONLYOFFICE_URL="${STAGE_ONLYOFFICE_URL:-http://192.0.2.12:8090}"
      export ONLYOFFICE_JWT_SECRET="${STAGE_ONLYOFFICE_JWT_SECRET:-${ONLYOFFICE_JWT_SECRET:-}}"
      # Стейдж шлёт письма в MailHog стенда (192.0.2.10:1025 внутри jarvis), боевой SMTP — только прод.
      # При необходимости переопределяется через STAGE_SMTP_* в CI/CD Variables.
      export SMTP_HOST="${STAGE_SMTP_HOST:-192.0.2.10}"
      export SMTP_PORT="${STAGE_SMTP_PORT:-1025}"
      export SMTP_SECURE="${STAGE_SMTP_SECURE:-false}"
      export SMTP_USER="${STAGE_SMTP_USER:-}"
      export SMTP_PASSWORD="${STAGE_SMTP_PASSWORD:-}"
      export SMTP_FROM="${STAGE_SMTP_FROM:-pmdb-stage@test.local}"
      export DATANEWTON_API_KEY="${DATANEWTON_API_KEY}"
      # Фид сотрудников: стенд обязан ходить в стенд портала, иначе тестовый
      # контур тянет данные из боевого. Общие EXTERNAL_HR_* указывают на прод —
      # для стенда есть STAGE_-версии.
      export EXTERNAL_HR_USERS_URL="${STAGE_EXTERNAL_HR_USERS_URL:-http://$STAGE_DEPLOY_HOST:8347/api/sync/pmdb-users}"
      export EXTERNAL_HR_API_TOKEN="${STAGE_EXTERNAL_HR_API_TOKEN:-${EXTERNAL_HR_API_TOKEN:-}}"
      export EXTERNAL_HR_ASSET_BASE_URL="${STAGE_EXTERNAL_HR_ASSET_BASE_URL:-http://$STAGE_DEPLOY_HOST:8347}"
      export HR_USERS_SYNC_SECRET="${STAGE_HR_USERS_SYNC_SECRET:-${HR_USERS_SYNC_SECRET:-}}"
      export HR_SYNC_INTERVAL_MINUTES=0
      export PARTNER_ENABLE_OPERATIONAL_STATUS_DERIVE=true
      export THESIS_DB_URL="${STAGE_THESIS_DB_URL:-${THESIS_DB_URL:-}}"
      export PARTNER_SYNC_INTERVAL_MINUTES="${STAGE_PARTNER_SYNC_INTERVAL_MINUTES:-15}"
      export PARTNER_CREATE_RESTRICTED="${STAGE_PARTNER_CREATE_RESTRICTED:-true}"
      # files-service на том же jarvis (nginx :3080). 127.0.0.1 из контейнера API — это сам API.
      export FILES_SERVICE_URL="${STAGE_FILES_SERVICE_URL:-http://192.0.2.10:3080}"
      export FILES_API_KEY="${STAGE_FILES_API_KEY:-}"
      export AUTH_RATE_LIMIT_MAX="${STAGE_AUTH_RATE_LIMIT_MAX:-50}"
      export AUTH_RATE_LIMIT_WINDOW_MS="${STAGE_AUTH_RATE_LIMIT_WINDOW_MS:-900000}"
      docker compose -p pmdb-stage -f docker-compose.stage.yml down || true
      docker compose -p pmdb-stage -f docker-compose.stage.yml up -d
      docker image prune -f || true
  environment:
    name: staging
    url: http://$STAGE_DEPLOY_HOST:3002
  only:
    - stage
