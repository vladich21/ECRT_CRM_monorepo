services:
  web:
    container_name: pmdb-web-stage
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NGINX_CONF: nginx.stage.conf
    ports:
      - "${WEB_PORT:-3002}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    container_name: pmdb-api-stage
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "9002"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - DATANEWTON_API_KEY=${DATANEWTON_API_KEY}
      - NODE_ENV=production
      - PORT=9002
      - FRONTEND_URL=${FRONTEND_URL}
      - UPLOAD_PATH=/app/apps/backend-nest/uploads
      - FILE_UPLOAD_URL=${FILE_UPLOAD_URL}
      # По умолчанию — MailHog (стейдж не шлёт в боевой SMTP).
      - SMTP_HOST=${SMTP_HOST:-192.0.2.12}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-pmdb-stage@test.local}
      - EXTERNAL_HR_USERS_URL=${EXTERNAL_HR_USERS_URL:-}
      - EXTERNAL_HR_API_TOKEN=${EXTERNAL_HR_API_TOKEN:-}
      - EXTERNAL_HR_ASSET_BASE_URL=${EXTERNAL_HR_ASSET_BASE_URL:-}
      - HR_USERS_SYNC_SECRET=${HR_USERS_SYNC_SECRET:-}
      - HR_SYNC_INTERVAL_MINUTES=${HR_SYNC_INTERVAL_MINUTES:-0}
      - PARTNER_ENABLE_OPERATIONAL_STATUS_DERIVE=${PARTNER_ENABLE_OPERATIONAL_STATUS_DERIVE:-true}
      - THESIS_DB_URL=${THESIS_DB_URL:-}
      # SVN конструкторов: без этих переменных раздел файлов из SVN не показывается.
      - SVN_URL=${SVN_URL:-}
      - SVN_USER=${SVN_USER:-}
      - SVN_SSH_KEY=${SVN_SSH_KEY:-}
      - SVN_SSH_KEY_BASE64=${SVN_SSH_KEY_BASE64:-}
      - PARTNER_SYNC_INTERVAL_MINUTES=${PARTNER_SYNC_INTERVAL_MINUTES:-15}
      - PARTNER_CREATE_RESTRICTED=${PARTNER_CREATE_RESTRICTED:-true}
      # OnlyOffice Document Server (общий сервис platform/onlyoffice)
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-}
      # Пусто = файлы как раньше в UPLOAD_PATH. На стейдже CI задаёт URL files-service на jarvis.
      - FILES_SERVICE_URL=${FILES_SERVICE_URL:-}
      - FILES_API_KEY=${FILES_API_KEY:-}
      # Пока ловим вылет сессии: не банить стенд после нескольких логинов/2FA.
      - AUTH_RATE_LIMIT_MAX=${AUTH_RATE_LIMIT_MAX:-50}
      - AUTH_RATE_LIMIT_WINDOW_MS=${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
    volumes:
      - /data/pmdb-stage/uploads:/app/apps/backend-nest/uploads
    restart: unless-stopped
