services:
  web:
    container_name: pmdb-web-prod
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-3001}:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    container_name: pmdb-api-prod
    build:
      context: .
      dockerfile: Dockerfile.api
    expose:
      - "9001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production
      - PORT=9001
      - FRONTEND_URL=${FRONTEND_URL}
      - UPLOAD_PATH=/app/apps/backend-nest/uploads
      - FILE_UPLOAD_URL=${FILE_UPLOAD_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
    volumes:
      - /data/pmdb/uploads:/app/apps/backend-nest/uploads
    restart: unless-stopped
